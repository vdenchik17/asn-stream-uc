<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>ASN Giveaway Overlay (Neon Text)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  * {
    box-sizing: border-box;
  }

  .overlay-wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  .overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(14px);
    animation: pulseVisibility 13s ease-in-out infinite;
  }

  /* Hollow neon text: transparent fill, visible only via stroke + glow */
  .username {
    font-family: 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 900;
    font-size: 36px;
    letter-spacing: 1px;
    white-space: nowrap;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(150, 210, 255, 0.95);
    text-shadow:
      0 0 6px rgba(100, 180, 255, 0.95),
      0 0 14px rgba(120, 90, 255, 0.9),
      0 0 26px rgba(150, 70, 255, 0.75),
      0 0 42px rgba(90, 150, 255, 0.5);
  }

  /* Reserved space for an icon to be added later, below the text */
  .icon-slot {
    width: 200px;
    height: auto;
    display: block;
    object-fit: contain;
  }

  /*
    Total loop = 13s (same timing pattern as previous overlays)
    0-1.2s    -> fade/slide in
    1.2-6.2s  -> fully visible (~5s)
    6.2-7.4s  -> fade/slide out
    7.4-13s   -> hidden (~5.6s, loop continues)
  */
  @keyframes pulseVisibility {
    0% {
      opacity: 0;
      transform: translateY(14px);
    }
    9.2% {
      opacity: 1;
      transform: translateY(0);
    }
    47.7% {
      opacity: 1;
      transform: translateY(0);
    }
    56.9% {
      opacity: 0;
      transform: translateY(14px);
    }
    100% {
      opacity: 0;
      transform: translateY(14px);
    }
  }
</style>
</head>
<body>

<div class="overlay-wrap">
  <div class="overlay" id="overlay">
    <span class="username">Розіграш в TGK</span>
    <img src="coin.png" class="icon-slot">
  </div>
</div>

<script>
  // Animation loops via CSS (infinite). This just guards against streaming
  // browser-source engines pausing CSS animations on initial load.
  window.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('overlay');
    if (el) {
      el.style.animation = 'none';
      void el.offsetWidth; // force reflow
      el.style.animation = '';
    }
  });
</script>

</body>
</html>
